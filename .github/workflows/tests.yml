name: Python tests

on:
  push:
    branches:
      - main
      - feature/**
      - hardening/**
      - experiment/**
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: python -m pytest -v

      - name: Export Qiskit circuit diagrams
        run: python -m visualization.quantum_circuits

      - name: Upload circuit diagrams
        uses: actions/upload-artifact@v4
        with:
          name: qiskit-bb84-circuit-diagrams
          path: results/quantum_circuits/
          if-no-files-found: error
